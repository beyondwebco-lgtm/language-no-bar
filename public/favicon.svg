<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0284C7" />
      <stop offset="100%" stopColor="#38BDF8" />
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Clean rounded container tile for universal visibility across dark and light browser tabs -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Dynamic Orbiting Swoosh Arc -->
  <path
    d="M 6 49 C 14 55 34 57 52 45 C 57 41.5 59 36 55 33 C 51 30 46 36 38 41 C 24 49 13 47 8 43 Z"
    fill="url(#arcGrad)"
  />

  <!-- Top swoosh tail -->
  <path
    d="M 18 16 C 30 8 46 9 54 18 C 50 16 38 13 24 19 Z"
    fill="url(#arcGrad)"
  />

  <!-- Globe Wireframe (Navy) -->
  <!-- Outer circle -->
  <circle cx="28" cy="30" r="19" fill="none" stroke="#072146" stroke-width="2.5" />
  <!-- Equator / horizontal lines -->
  <path d="M 9.5 30 H 46.5" stroke="#072146" stroke-width="1.8" />
  <path d="M 12 21 C 17 25 39 25 44 21" stroke="#072146" stroke-width="1.6" fill="none" />
  <path d="M 12 39 C 17 35 39 35 44 39" stroke="#072146" stroke-width="1.6" fill="none" />
  <!-- Longitude lines -->
  <ellipse cx="28" cy="30" rx="9" ry="19" fill="none" stroke="#072146" stroke-width="1.8" />

  <!-- Left Blue Dialogue Bubble ("A") -->
  <g>
    <!-- Speech bubble body + pointer -->
    <path
      d="M 12 23 C 12 20.5 14 18.5 16.5 18.5 H 28.5 C 31 18.5 33 20.5 33 23 V 31 C 33 33.5 31 35.5 28.5 35.5 H 18 L 13 39.5 V 35.5 H 16.5 C 14 35.5 12 33.5 12 31 Z"
      fill="#0284C7"
    />
    <!-- Letter "A" -->
    <text
      x="22.5"
      y="30"
      font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif"
      font-size="12"
      font-weight="900"
      fill="#FFFFFF"
      text-anchor="middle"
    >A</text>
  </g>

  <!-- Right Orange Dialogue Bubble ("अ") -->
  <g>
    <!-- Speech bubble body + pointer -->
    <path
      d="M 27 28 C 27 25.5 29 23.5 31.5 23.5 H 43.5 C 46 23.5 48 25.5 48 28 V 36 C 48 38.5 46 40.5 43.5 40.5 H 41 V 44.5 L 36 40.5 H 31.5 C 29 40.5 27 38.5 27 36 Z"
      fill="#EA580C"
    />
    <!-- Devanagari "अ" -->
    <text
      x="37.5"
      y="35.5"
      font-family="system-ui, -apple-system, 'Noto Sans Devanagari', sans-serif"
      font-size="12"
      font-weight="900"
      fill="#FFFFFF"
      text-anchor="middle"
    >अ</text>
  </g>
</svg>
