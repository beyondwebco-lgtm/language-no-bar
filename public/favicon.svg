  </defs>

  <!-- Background Base Shield -->
  <rect width="52" height="52" rx="14" fill="url(#favNavy)" />

  <!-- Accent Corner Dot -->
  <circle cx="41" cy="11" r="2.8" fill="url(#favCyan)" />

  <!-- 1. Left Upright Pillar: "I" -->
